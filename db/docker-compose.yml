services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: riskengine
      POSTGRES_USER: riskengine
      POSTGRES_PASSWORD: riskengine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskengine -d riskengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies db/migrations via the official Flyway CLI image (no Flyway
  # install needed on the host) and exits; `postgres` keeps running.
  flyway:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://postgres:5432/riskengine
      -user=riskengine
      -password=riskengine
      -connectRetries=10
      migrate

volumes:
  postgres_data:
